[project]
name = "voice-to-voice-backend"
version = "0.1.0"
description = "Ultra-low-latency voice-to-voice AI assistant — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "google-genai>=1.0",
    "openai>=1.50",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "main"]

[tool.setuptools.packages.find]
include = ["websocket*", "voice*", "stt*", "services*", "utils*", "core*", "spike*", "llm*", "tts*"]
