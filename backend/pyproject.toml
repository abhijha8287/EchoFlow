[project]
name = "voice-to-voice-backend"
version = "0.1.0"
description = "Ultra-low-latency voice-to-voice AI assistant — FastAPI backend"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["websocket*", "voice*", "stt*", "services*", "utils*"]
